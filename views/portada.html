{% extends 'main.html' %}

{% block content %}
    <h2 class="seccion-titulo">Noticias</h2>

    <section class="noticias">
      {% for noticia in noticias %}
        <article class="tarjeta">
          <a href="./noticia/{{ noticia.id }}">
            <img class="noticia-imagen" src="{{ noticia.image_url }}" alt="{{ noticia.title }}"/>
          </a>
          <span class="titulo">{{ noticia.title }}</span>
        </article>
      {% endfor %}
    </section>
      
{% endblock %}
